services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: exam_2400030107
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springboot-postgres-net

  backend:
    image: yashwanthbandaru64/docker-backend-2400030107:latest
    build:
      context: ./backend/CrudService
      dockerfile: Dockerfile
    container_name: docker-springboot
    ports:
      - "8081:8081"
    depends_on:
      - postgresdb
    restart: on-failure
    networks:
      - springboot-postgres-net

  frontend:
    image: yashwanthbandaru64/docker-frontend-2400030107:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docker-react
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - springboot-postgres-net

volumes:
  postgres_data:

networks:
  springboot-postgres-net:
